{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rehan Job Portal</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<div class="d-flex">

    <!-- SIDEBAR -->
    <div class="sidebar p-3">

        <h4 class="text-white mb-4">
            <i class="bi bi-briefcase-fill"></i> RehanJob
        </h4>

        <a href="/home/" class="menu"><i class="bi bi-house-door"></i> Dashboard</a>
        <a href="/jobs/" class="menu"><i class="bi bi-briefcase"></i> Jobs</a>
        <a href="/saved-jobs/" class="menu"><i class="bi bi-bookmark"></i> Saved Jobs</a>
        <a href="/companies/" class="menu"><i class="bi bi-building"></i> Companies</a>
        <a href="/applications/" class="menu"><i class="bi bi-file-earmark-text"></i> Applications</a>
        <a href="/profile/" class="menu"><i class="bi bi-person-circle"></i> Profile</a>

        <hr>

        <a href="/logout/" class="menu text-danger">
            <i class="bi bi-box-arrow-right"></i> Logout
        </a>

    </div>


    <!-- MAIN -->
    <div class="content w-100">

        <!-- TOPBAR -->
        <nav class="topbar p-3 shadow-sm bg-white d-flex justify-content-between align-items-center">

            <form method="GET" action="/jobs/" class="w-50">
                <input type="text" name="q" class="form-control" placeholder="Search jobs, companies...">
            </form>

            <div class="d-flex align-items-center">

                <!-- 🔔 FIXED BELL -->
                <a href="/notifications/" class="position-relative me-4 text-dark">

                    <i class="bi bi-bell fs-5"></i>

                    {% if notification_count > 0 %}
                    <span class="badge bg-danger position-absolute top-0 start-100 translate-middle rounded-pill">
                        {{ notification_count }}
                    </span>
                    {% endif %}

                </a>

                <span class="me-2 fw-semibold">{{ request.user.username }}</span>
                <i class="bi bi-person-circle fs-4"></i>

            </div>

        </nav>

        <div class="container-fluid mt-4">
            {% block content %}{% endblock %}
        </div>

    </div>

</div>

</body>
</html>
