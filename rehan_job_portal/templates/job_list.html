{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Available Jobs</h2>
</div>

<div class="row">

{% for job in jobs %}

<div class="col-lg-6 mb-4">

<div class="card shadow-sm border-0 h-100">

<div class="card-body">

    <!-- Job Title -->
    <h5 class="fw-bold mb-2">{{ job.title }}</h5>

    <!-- Company -->
    <p class="text-muted mb-1">
        <i class="bi bi-building"></i>
        {{ job.company.name }}
    </p>

    <!-- Location -->
    <p class="mb-1">
        <i class="bi bi-geo-alt"></i>
        {{ job.location }}
    </p>

    <!-- Salary -->
    <p class="mb-2">
        <i class="bi bi-cash-stack"></i>
        Salary: ₹{{ job.salary }}
    </p>

    <!-- Description -->
    <p class="text-muted small">
        {{ job.description|truncatewords:15 }}
    </p>

</div>

<div class="card-footer bg-white border-0">

<div class="d-flex gap-2">

    <!-- Apply Button -->
    <a href="{% url 'apply' job.id %}" class="btn btn-primary btn-sm">
        <i class="bi bi-send"></i> Apply
    </a>

    <!-- Save Button -->
    <a href="{% url 'save_job' job.id %}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-bookmark"></i> Save
    </a>

</div>

</div>

</div>

</div>

{% empty %}

<div class="col-12">
    <div class="alert alert-info">
        No jobs available right now.
    </div>
</div>

{% endfor %}

</div>

{% endblock %}
